<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda Manicure</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Agenda"><meta name="theme-color" content="#0d0c0c"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#fbf3f1;--cd:#fff;--tx:#3a2630;--mu:#8a6f79;--bd:#f0dde2;--ac:#c2417a;--so:#f9e3ea;--ok:#2e8b63;--er:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1418;--cd:#2a1c22;--tx:#f6e9ee;--mu:#b99aa6;--bd:#43303a;--ac:#f07aa8;--so:#3a2430;--ok:#52c496;--er:#ef7a6c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1418;--cd:#2a1c22;--tx:#f6e9ee;--mu:#b99aa6;--bd:#43303a;--ac:#f07aa8;--so:#3a2430;--ok:#52c496;--er:#ef7a6c;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Nunito,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
main{max-width:520px;margin:0 auto;padding:12px 14px 90px}
.brand{background:var(--cd);border:1px solid var(--bd);border-radius:16px;margin:0 0 10px;padding:10px 14px;display:flex;align-items:center;justify-content:center;gap:12px}.brand img{display:block;max-height:72px;max-width:45%;width:auto;height:auto;object-fit:contain}.brand img:not([src]){display:none}.brand span{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:clamp(22px,6.5vw,30px);line-height:1.15;color:var(--ac)}
h1,h2{font-family:"Playfair Display",Georgia,serif;margin:0}h1{font-size:26px}
.hid{display:none!important}.mu{color:var(--mu);font-size:13px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:12px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:10px;font:inherit}
input:focus-visible,button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
label{display:block;margin:10px 0 4px;color:var(--mu);font-size:13px}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px;min-height:48px;background:var(--ac);color:#fff;cursor:pointer;width:100%;text-align:center;text-decoration:none;display:block}
.gh{background:var(--so);color:var(--ac)}.dl{background:none;color:var(--er);border:1px solid var(--bd)}
.big{font-family:"Playfair Display",serif;font-size:34px;color:var(--ac);line-height:1.1}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.g3 b{font-size:20px;display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dn{display:grid;grid-template-columns:48px 1fr 48px 74px;gap:6px}.dn button{padding:0}
.ap{display:flex;gap:10px;align-items:center;cursor:pointer;border-left:5px solid var(--ac)}
.ap.sc{border-left-color:var(--ok)}.ap.sf,.ap.sx{border-left-color:var(--mu);opacity:.65}
.ap.ev{border-left-color:#8a6f79; background:var(--bg)}
.tm{font-family:"Playfair Display",serif;font-weight:700;font-size:18px;min-width:52px}.bd{flex:1;min-width:0}
.pr{text-align:right}.ok{min-height:34px;padding:4px 10px;font-size:13px;margin-top:4px;background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{width:auto;min-height:38px;padding:6px 12px;font-size:14px;background:var(--so);color:var(--ac)}
.it{display:grid;grid-template-columns:1fr 82px 66px 40px;gap:6px;align-items:end;padding:8px 0;border-top:1px solid var(--bd)}
.it label{margin:0;font-size:11px}.it small{display:block;color:var(--mu)}.x{padding:0;min-height:44px;background:none;color:var(--er);font-size:22px}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{flex:1 1 28%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:8px 2px;min-height:44px;font-size:13px}.seg .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 24px)}.sheet>div{max-width:520px;margin:0 auto}
.day{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.sr{display:grid;grid-template-columns:1fr 70px 56px 40px;gap:6px;margin-bottom:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.nav button{background:none;color:var(--mu);border-radius:0;min-height:54px;font-size:12px}.nav .on{color:var(--ac);box-shadow:inset 0 2px 0 var(--ac)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90%}.toast.show{opacity:1}
.tg{font-weight:700;color:var(--ac)}.tg.p{color:#c78a00}.tg.c{color:var(--ok)}.tg.x,.tg.f{color:var(--mu)}.ap.sp{border-left-color:#e0a100}.seg.col{flex-direction:column}.seg.col button{flex:none}
.alm{position:fixed;inset:0;z-index:70;background:var(--er);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;animation:pl .6s infinite alternate}.alm button{max-width:340px}@keyframes pl{to{background:#7f1d1d}}
textarea{min-height:70px;font:13px monospace}
.cli{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.cli .num{font-family:"Playfair Display",serif;font-weight:700;font-size:18px;color:var(--ac);min-width:36px}
.cli .info{flex:1;min-width:0}
.cli .info b{display:block}
.wa-btn{min-height:40px;padding:6px 12px;font-size:13px;width:auto;background:#25D366;color:#fff;border-radius:12px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.cli-actions{display:flex;gap:6px;flex-shrink:0}
.cli-actions button{min-height:40px;padding:6px 10px;font-size:13px;width:auto}
.search-box{margin-bottom:8px}
.hist-item{padding:8px 0;border-top:1px solid var(--bd);font-size:14px}
.hist-item .mu{font-size:12px}
.notes-preview{font-size:12px;color:var(--mu);margin-top:2px;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
</style></head>
<body><main>
<div class="brand hid" id="brand"><img id="logo" alt=""><span id="bn"></span></div>

<div id="v-ag">
 <div class="row"><h1>Agenda</h1><span class="mu" id="dLab"></span></div>
 <div class="card"><div class="dn" style="grid-template-columns: 48px 1fr 48px 74px;">
   <button class="gh" id="dp">‹</button>
   <input type="date" id="dd">
   <button class="gh" id="dnx">›</button>
   <button class="gh" id="dto">Hoje</button>
 </div></div>
 <div class="card"><div class="mu">Total do dia (concluídos)</div><div class="big" id="dEu">0,00 €</div></div>
 <div id="list"></div>
</div>

<nav class="nav" id="nav">
 <button data-v="ag" class="on">Agenda</button>
</nav>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const KEY = 'agenda:v1';
const FIREBASE_URL = "https://calendario-tayane-nail-design-default-rtdb.europe-west1.firebasedatabase.app/agendamentos.json";

let S = { apps: [], clients: [] };

try {
  const r = JSON.parse(localStorage.getItem(KEY));
  if (r && r.apps) S = Object.assign(S, r);
} catch (e) {}

// Sincronização automática com o Firebase
async function syncToFirebase() {
  try {
    const payload = {};
    S.apps.forEach(app => {
      if (app.status !== 'x') { // Não sincroniza cancelados
        payload[app.id || 'id_' + Date.now()] = {
          data: app.date,
          hora: app.time,
          duracao: app.duration || 60,
          status: "ocupado"
        };
      }
    });

    await fetch(FIREBASE_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  } catch (err) {
    console.error("Erro ao sincronizar com Firebase:", err);
  }
}

const save = () => {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
    syncToFirebase(); // Envia para a nuvem sempre que guardar
  } catch (e) {}
};

function toast(m) {
  const t = $('toast');
  t.textContent = m;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

// Inicialização rápida
$('dd').value = new Date().toISOString().split('T')[0];
</script>
</body>
</html>
